name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Flutter Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/flutter_demo

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

  build-android:
    name: Flutter Android Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: flutter/flutter_demo

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Android patches
        run: |
          dart tools/android/apply_android_compile_sdk.dart
          dart tools/android/apply_android_flutter_compile_sdk.dart
          dart tools/android/apply_android_camera_camerax.dart

      - name: Build Flutter Android module
        run: flutter build aar --no-pub

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: flutter-aar
          path: flutter/flutter_demo/build/host/outputs/aar/*.aar
