name: Flutter CI

# Flutter 侧独立 CI 流水线：代码分析、单元测试与 Android AAR 构建打包。
#
# 设计要点：
#   1. 独立流水线隔离：Flutter 构建依赖 Flutter SDK 与特定 Dart 工具链，
#      与 Android 主流水线（build.yml）解耦，避免纯 Android 改动被 Flutter 构建拖慢。
#   2. 缓存优化：使用 subosito/flutter-action 开启 cache 复用 Flutter SDK 与 pub 依赖缓存。
#   3. 产物交付：通过静态分析与单元测试后，构建 Flutter Android AAR 并上传 Artifact。
#
# 未纳入本矩阵（演进规划）：Flutter 端到端驱动测试（UI 自动化打靶由本地负责）。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Flutter Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/flutter_demo

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

  build-android:
    name: Flutter Android Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: flutter/flutter_demo

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Android patches
        run: dart tools/apply_android_fixes.dart

      - name: Build Flutter Android module
        run: flutter build aar --no-pub

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: flutter-aar
          path: flutter/flutter_demo/build/host/outputs/aar/*.aar
