include: package:flutter_lints/flutter.yaml

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

analyzer:
  errors:
    missing_required_param: error      # 缺少必需参数时报错
    missing_return: error              # 缺少返回值时报错
    todo: ignore                       # 忽略 TODO 注释警告
  language:
    strict-casts: true                 # 严格类型转换检查
    strict-inference: true             # 严格类型推断检查
    strict-raw-types: true             # 禁止使用原始类型（如 List 而不是 List<String>）
  exclude:
    - "**/*.g.dart"                    # 排除生成的代码文件（如 json_serializable 生成的文件）
    - "**/*.freezed.dart"              # 排除 freezed 包生成的代码文件（不可变数据类代码生成）

linter:
  rules:
    # 禁用文件名检查
    file_names: false
    # 错误预防
    avoid_dynamic_calls: true              # 避免在 dynamic 类型上调用方法，防止运行时错误
    avoid_print: true                      # 避免使用 print，推荐使用日志库
    avoid_types_as_parameter_names: true   # 避免使用类型名作为参数名（如 int、String），防止混淆
    avoid_empty_else: true                 # 避免空的 else 块
    avoid_relative_lib_imports: true       # 避免使用相对路径导入 lib 目录下的文件
    avoid_slow_async_io: true              # 避免使用性能较慢的异步 IO 方法
    avoid_type_to_string: true             # 避免对类型调用 toString()
    cancel_subscriptions: true             # 确保取消 Stream 订阅
    close_sinks: true                      # 确保关闭 Stream 控制器
    empty_statements: true                 # 避免空语句（多余的冒号）
    no_duplicate_case_values: true         # 避免 switch 中有重复的 case 值
    throw_in_finally: true                 # 避免在 finally 块中抛出异常
    unnecessary_statements: true           # 避免不必要的语句

    # 代码风格
    always_declare_return_types: true      # 始终声明函数返回类型
    always_use_package_imports: true       # 始终使用 package 导入方式
    annotate_overrides: true               # 标记重写的方法必须添加 @override
    avoid_init_to_null: true               # 避免显式将变量初始化为 null
    avoid_null_checks_in_equality_operators: true  # 避免在 == 操作符中进行 null 检查
    avoid_renaming_method_parameters: true # 避免重命名继承方法的参数
    avoid_return_types_on_setters: true    # 避免在 setter 上声明返回类型
    avoid_unnecessary_containers: true     # 避免使用不必要的 Container
    await_only_futures: true               # 只在 Future 上使用 await
    camel_case_extensions: true            # 扩展名使用驼峰命名法
    camel_case_types: true                 # 类型名使用驼峰命名法
    constant_identifier_names: true        # 常量使用大写下划线命名法
    curly_braces_in_flow_control_structures: true  # 流程控制语句使用大括号
    empty_catches: true                    # 避免空的 catch 块
    empty_constructor_bodies: true         # 避免空的构造函数体
    exhaustive_cases: true                 # switch 语句必须处理所有枚举值
    implementation_imports: true           # 避免导入 src 目录下的实现文件
    library_names: false                   # 禁用库名命名检查，允许数字前缀
    library_prefixes: false                # 禁用库前缀命名检查，允许数字前缀文件名
    no_leading_underscores_for_local_identifiers: true # 局部标识符不要使用下划线开头
    null_check_on_nullable_type_parameter: true      # 避免对可空类型参数进行 null 检查
    null_closures: true                    # 避免传递 null 作为闭包
    prefer_adjacent_string_concatenation: true       # 优先使用相邻字符串连接
    prefer_collection_literals: true       # 优先使用集合字面量
    prefer_conditional_assignment: true    # 优先使用条件赋值
    prefer_const_constructors: true        # 优先使用 const 构造函数
    prefer_const_constructors_in_immutables: true    # 不可变类优先使用 const 构造函数
    prefer_const_declarations: true        # 优先使用 const 声明
    prefer_const_literals_to_create_immutables: true # 创建不可变对象时优先使用 const 字面量
    prefer_contains: true                  # 优先使用 contains 方法
    prefer_final_fields: true              # 优先使用 final 字段
    prefer_final_in_for_each: true         # forEach 中优先使用 final
    prefer_final_locals: true              # 局部变量优先使用 final
    prefer_for_elements_to_map_fromIterable: true    # 优先使用 for 元素而不是 map fromIterable
    prefer_function_declarations_over_variables: true # 优先使用函数声明而不是变量
    prefer_if_null_operators: true         # 优先使用 ?? 运算符
    prefer_initializing_formals: true      # 优先使用初始化形式参数
    prefer_inlined_adds: true              # 优先使用内联 add 方法
    prefer_interpolation_to_compose_strings: true    # 优先使用插值来组合字符串
    prefer_is_empty: true                  # 优先使用 isEmpty
    prefer_is_not_empty: true              # 优先使用 isNotEmpty
    prefer_is_not_operator: true           # 优先使用 is! 操作符
    prefer_iterable_whereType: true        # 优先使用 whereType 方法
    prefer_null_aware_method_calls: true   # 优先使用空感知方法调用
    prefer_null_aware_operators: true      # 优先使用空感知运算符
    prefer_spread_collections: true        # 优先使用展开集合
    prefer_typing_uninitialized_variables: true      # 未初始化变量优先声明类型
    recursive_getters: true                # 避免递归 getter
    sized_box_for_whitespace: true         # 使用 SizedBox 代替空白 Container
    slash_for_doc_comments: true           # 文档注释使用 //
    sort_child_properties_last: true       # 将 child 属性排在最后
    type_init_formals: true                # 类型初始化形式参数
    unawaited_futures: true                # 标记未等待的 Future
    unnecessary_brace_in_string_interps: true        # 避免字符串插值中不必要的括号
    unnecessary_const: true                # 避免不必要的 const
    unnecessary_constructor_name: true     # 避免不必要的构造函数名
    unnecessary_getters_setters: true      # 避免不必要的 getter/setter
    unnecessary_late: true                 # 避免不必要的 late
    unnecessary_new: true                  # 避免不必要的 new
    unnecessary_null_aware_assignments: true         # 避免不必要的空感知赋值
    unnecessary_null_in_if_null_operators: true      # 避免 ?? 运算符中不必要的 null
    unnecessary_nullable_for_final_variable_declarations: true  # 避免 final 变量使用可空类型
    unnecessary_overrides: true            # 避免不必要的方法重写
    unnecessary_parenthesis: true          # 避免不必要的括号
    unnecessary_string_escapes: true       # 避免不必要的字符串转义
    unnecessary_string_interpolations: true # 避免不必要的字符串插值
    unnecessary_this: true                 # 避免不必要的 this
    use_build_context_synchronously: true  # 异步操作后检查 BuildContext 是否可用
    use_full_hex_values_for_flutter_colors: true     # 使用完整的十六进制颜色值
    use_function_type_syntax_for_parameters: true    # 使用函数类型语法声明参数
    use_key_in_widget_constructors: true   # Widget 构造函数中使用 Key 参数
    use_rethrow_when_possible: true        # 尽可能使用 rethrow
    use_super_parameters: true             # 使用 super 参数
    void_checks: true                      # 检查 void 返回值使用
