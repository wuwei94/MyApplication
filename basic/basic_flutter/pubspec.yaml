name: basic_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.8

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Flutter 官方资源
  # https://pub.dev/packages/cupertino_icons
  cupertino_icons: ^1.0.8

  # lib/core/utils/logger
  # https://pub.dev/packages/logger
  logger: ^2.6.1

  # lib/app、lib/catalog
  # https://pub.dev/packages/go_router
  go_router: ^17.1.0
  # https://pub.dev/packages/auto_route
  auto_route: ^11.1.0

  # 建模与代码生成注解
  # https://pub.dev/packages/freezed_annotation
  freezed_annotation: ^3.1.0

  # lib/demos/basics
  # https://pub.dev/packages/get
  get: ^4.7.2
  # https://pub.dev/packages/get_storage
  get_storage: ^2.1.1
  # https://pub.dev/packages/english_words
  english_words: ^4.0.0

  # lib/demos/state_management
  # https://pub.dev/packages/flutter_bloc
  flutter_bloc: ^9.1.1
  # https://pub.dev/packages/provider
  provider: ^6.1.5
  # https://pub.dev/packages/flutter_riverpod
  flutter_riverpod: ^3.3.1

  # lib/demos/network
  # https://pub.dev/packages/dio
  dio: ^5.9.0
  # https://pub.dev/packages/http
  http: ^1.5.0

  # lib/demos/storage
  # https://pub.dev/packages/shared_preferences
  shared_preferences: ^2.5.3
  # https://pub.dev/packages/flutter_secure_storage
  flutter_secure_storage: ^10.0.0
  # https://pub.dev/packages/hive
  hive: ^2.2.3
  # https://pub.dev/packages/hive_flutter
  hive_flutter: ^1.1.0
  # https://pub.dev/packages/drift
  drift: ^2.32.1
  # https://pub.dev/packages/isar_community
  isar_community: ^3.3.2
  # https://pub.dev/packages/isar_community_flutter_libs
  isar_community_flutter_libs: ^3.3.2
  # https://pub.dev/packages/objectbox
  objectbox: ^5.3.1
  # https://pub.dev/packages/objectbox_flutter_libs
  objectbox_flutter_libs: ^5.3.1
  # https://pub.dev/packages/path_provider
  path_provider: ^2.1.5

  # lib/demos/image
  # https://pub.dev/packages/cached_network_image
  cached_network_image: ^3.4.1
  # https://pub.dev/packages/extended_image
  extended_image: ^10.0.1
  # https://pub.dev/packages/photo_view
  photo_view: ^0.15.0
  # https://pub.dev/packages/flutter_image_compress
  flutter_image_compress: ^2.4.0
  # https://pub.dev/packages/flutter_luban
  flutter_luban: ^0.1.15
  # https://pub.dev/packages/image_cropper
  image_cropper: ^12.2.1
  # https://pub.dev/packages/image_picker
  image_picker: ^1.2.1
  # https://pub.dev/packages/wechat_assets_picker
  wechat_assets_picker: ^10.1.1
  # https://pub.dev/packages/wechat_camera_picker
  wechat_camera_picker: ^4.5.0

  # lib/demos/animation
  # https://pub.dev/packages/flutter_svg
  flutter_svg: ^2.2.1
  # https://pub.dev/packages/lottie
  lottie: ^3.3.2
  # https://pub.dev/packages/flutter_svga
  flutter_svga: ^0.0.13
  # https://pub.dev/packages/pag_flutter
  pag_flutter: ^0.0.1

  # lib/demos/video
  # https://pub.dev/packages/video_player
  video_player: ^2.11.1
  # https://pub.dev/packages/chewie
  chewie: ^1.13.0

  # lib/demos/packages/layout
  # https://pub.dev/packages/flutter_screenutil
  flutter_screenutil: ^5.9.3
  # https://pub.dev/packages/flutter_constraintlayout
  flutter_constraintlayout: ^1.7.0-stable
  # https://pub.dev/packages/easy_refresh
  easy_refresh: ^3.5.0
  # https://pub.dev/packages/easy_paging
  easy_paging: ^3.5.0
  # https://pub.dev/packages/scroll_to_index
  scroll_to_index: ^3.0.1
  # https://pub.dev/packages/flutter_slidable
  flutter_slidable: ^4.0.3
  # https://pub.dev/packages/flutter_staggered_grid_view
  flutter_staggered_grid_view: ^0.7.0
  # https://pub.dev/packages/auto_size_text
  auto_size_text: ^3.0.0
  # https://pub.dev/packages/flutter_keyboard_visibility
  flutter_keyboard_visibility: ^6.0.0
  # https://pub.dev/packages/slider_captcha
  slider_captcha: ^1.0.2
  # https://pub.dev/packages/infinite_scroll_pagination
  infinite_scroll_pagination: ^5.1.1

  # lib/demos/packages/content
  # https://pub.dev/packages/extended_text_field
  extended_text_field: ^16.0.2
  # https://pub.dev/packages/flutter_linkify
  flutter_linkify: ^6.0.0
  # https://pub.dev/packages/google_fonts
  google_fonts: ^8.0.2

  # lib/demos/packages/platform
  # https://pub.dev/packages/permission_handler
  permission_handler: ^12.0.1
  # https://pub.dev/packages/flutter_local_notifications
  flutter_local_notifications: ^21.0.0
  # https://pub.dev/packages/url_launcher
  url_launcher: ^6.3.2
  # https://pub.dev/packages/webview_flutter
  webview_flutter: ^4.13.0
  # https://pub.dev/packages/connectivity_plus
  connectivity_plus: ^7.1.1
  # https://pub.dev/packages/geolocator
  geolocator: ^14.0.2
  # https://pub.dev/packages/device_info_plus
  device_info_plus: ^12.4.0
  # https://pub.dev/packages/package_info_plus
  package_info_plus: ^9.0.1
  # https://pub.dev/packages/share_plus
  share_plus: ^12.0.2
  # https://pub.dev/packages/android_id
  android_id: ^0.5.1

  # lib/demos/packages/time
  # https://pub.dev/packages/intl
  intl: ^0.20.2
  # https://pub.dev/packages/timeago
  timeago: ^3.7.1

  # lib/demos/packages/utils
  # https://pub.dev/packages/flutter_smart_dialog
  flutter_smart_dialog: ^5.1.0
  # https://pub.dev/packages/fluttertoast
  fluttertoast: ^9.0.0
  # https://pub.dev/packages/event_bus
  event_bus: ^2.0.1
  # https://pub.dev/packages/uuid
  uuid: ^4.5.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  # 分析与测试
  # https://pub.dev/packages/flutter_lints
  flutter_lints: ^6.0.0

  # 代码生成
  # https://pub.dev/packages/build_runner
  build_runner: ^2.13.1
  # https://pub.dev/packages/freezed
  freezed: ^3.2.3
  # https://pub.dev/packages/json_serializable
  json_serializable: ^6.7.1
  # https://pub.dev/packages/objectbox_generator
  objectbox_generator: ^5.3.1
  # https://pub.dev/packages/drift_dev
  drift_dev: ^2.32.1
  # https://pub.dev/packages/isar_community_generator
  isar_community_generator: ^3.3.2

objectbox:
  output_dir: objectbox

# sqlite3 3.x 默认会在 native assets 构建时从 GitHub 下载预编译 SQLite。
# Android 调试构建使用系统 SQLite，避免网络受限时下载 libsqlite3.so 超时。
hooks:
  user_defines:
    sqlite3:
      source: system
      name_android: sqlite

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add Flutter specific assets to your application, add an assets section,
  # like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/json/
    - assets/images/
    - assets/video/
    - assets/anim/svg/
    - assets/anim/lottie/
    - assets/anim/pag/
    - assets/anim/svga/

  fonts:
    - family: Juice
      fonts:
        - asset: assets/fonts/juice.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add Flutter specific custom fonts to your application, add a fonts
  # section here, in this "flutter" section. Each entry in this list should
  # have a "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages


  # This section identifies your Flutter project as a module meant for
  # embedding in a native host app.  These identifiers should _not_ ordinarily
  # be changed after generation - they are used to ensure that the tooling can
  # maintain consistency when adding or modifying assets and plugins.
  # They also do not have any bearing on your native host application's
  # identifiers, which may be completely independent or the same as these.
  module:
    androidX: true
    androidPackage: com.example.william.my.basic.basic_flutter
    iosBundleIdentifier: com.example.william.my.basic.basicFlutter
