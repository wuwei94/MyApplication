# ==============================================================================
# 工程级 Gradle 全局属性配置
# 说明：IDE（如 Android Studio）配置会覆盖本文件。构建环境配置参见 Gradle 官方文档。
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. JVM 与 Gradle / Kotlin Daemon 运行环境配置
# ------------------------------------------------------------------------------
# Gradle 守护进程 JVM 参数：G1 收集器、软引用快速回收、加大 JIT 代码缓存、4GB 堆上下限对齐（对齐 NiA）
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Xmx4g -Xms4g

# Kotlin 守护进程 JVM 参数：独立 JVM 进程，加大代码缓存与元空间，避免多模块编译 OOM（对齐 NiA）
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=320m -XX:+HeapDumpOnOutOfMemoryError -Xmx4g -Xms4g

# ------------------------------------------------------------------------------
# 2. Gradle 构建性能与隔离体系（参考 Now in Android 实践）
# ------------------------------------------------------------------------------
# 开启多模块解耦并行构建
org.gradle.parallel=true

# 开启本地与远程构建缓存
org.gradle.caching=true

# 开启文件系统监控，加速增量构建识别
org.gradle.vfs.watch=true

# Gradle 9.4+ Tooling API 并行同步（加快 IDE 模型导入）
org.gradle.tooling.parallel=true

# 配置缓存（Configuration Cache）：暂保持关闭
# 阻断项：Flutter 任务 (:flutter:compileFlutterBuildDebug) 访问 Task.project、ObjectBox 无法序列化 Project，待上游适配后开启
#org.gradle.configuration-cache=true
#org.gradle.configuration-cache.parallel=true
#org.gradle.configuration-cache.problems=fail

# 开启项目隔离（Isolated Projects）：配置期子项目完全解耦并行
org.gradle.isolated-projects=true

# 开启 KSP 项目隔离模式（对齐 NiA，保障 Project Isolation 环境下 KSP 稳定并发）
ksp.project.isolation.enabled=true

# ------------------------------------------------------------------------------
# 3. Kotlin 编译与代码风格治理
# ------------------------------------------------------------------------------
# Kotlin 官方代码风格规范
kotlin.code.style=official

# Kotlin 与 Java 目标 JVM 版本一致性校验级别（warning 避免轻微差异直接中断构建）
kotlin.jvm.target.validation.mode=warning

# 是否将 Kotlin 编译警告视为错误（默认 false，可本地或 CI 通过 -PwarningsAsErrors=true 严格校验，对齐 NiA）
warningsAsErrors=false

# 禁用 KAPT 增量处理，规避 DataBinding 编译器抛出 ProcessingEnvironment NPE
kapt.incremental.apt=false

# Compose 编译器性能分析与诊断报告（按需取消注释，输出至 build/compose-metrics 与 build/compose-reports）
#enableComposeCompilerMetrics=true
#enableComposeCompilerReports=true

# ------------------------------------------------------------------------------
# 4. AndroidX 与资源 / R 类特性
# ------------------------------------------------------------------------------
# 启用 AndroidX 支持
android.useAndroidX=true

# 启用 Jetifier 依赖库转换（ARouter 1.5.2 兼容 support.v4.app.Fragment 所需）
android.enableJetifier=true

# 启用非传递性 R 类：各模块 R 类仅包含自身资源，跨模块需显式指定 R 类，加速多模块增量编译
android.nonTransitiveRClass=true

# 资源 ID 生成非 final 常量（R8 优化资源收缩 shrinkResources 的前置要求）
android.nonFinalResIds=true

# ------------------------------------------------------------------------------
# 5. BuildFeatures 默认构建功能开关
# ------------------------------------------------------------------------------
# 默认禁用无需全局开启的构建特性，按需在具体模块中显式声明以加快编译（对齐 NiA）
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.viewbinding=true

# 可选收窄特性（默认已按需开启或本仓未使用）：
# android.defaults.buildfeatures.aidl=true
# android.defaults.buildfeatures.compose=true
# android.defaults.buildfeatures.buildconfig=true
# android.defaults.buildfeatures.prefab=true
# android.defaults.buildfeatures.renderscript=true
# android.defaults.buildfeatures.databinding=true
# android.defaults.buildfeatures.mlmodelbinding=true
# android.defaults.buildfeatures.prefabpublishing=true

# ------------------------------------------------------------------------------
# 6. Gradle 9.0+ / AGP 现代构建属性
# ------------------------------------------------------------------------------
# 未设置 targetSdk 时不隐式回退为 compileSdk
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false

# 启用应用编译时 R 类生成，加速构建
android.enableAppCompileTimeRClass=true

# 禁止在 AndroidManifest.xml 中声明 uses-sdk 标签，强制收敛至 build.gradle
android.usesSdkInManifest.disallowed=true

# 强制要求每个模块使用唯一的包名
android.uniquePackageNames=true

# 启用依赖版本约束管理
android.dependency.useConstraints=true

# 排除库组件约束，提升大型多模块工程 Gradle Sync 与配置性能
android.dependency.excludeLibraryComponentsFromConstraints=true

# 消除约束启用时的同步提示警告
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# 启用 R8 严格完整模式 Keep 规则
android.r8.strictFullModeForKeepRules=true

# 启用 R8 优化资源收缩
android.r8.optimizedResourceShrinking=true

# 禁用 AGP 内置 Kotlin（本仓由 KGP 提供 Kotlin 支持；与 newDsl 绑定，待 kapt→KSP 迁移后整体升级）
android.builtInKotlin=false

# 禁用 AGP New DSL（保持 legacy DSL 以兼容 KGP BaseExtension 投影；待 kapt→KSP 迁移后升级）
android.newDsl=false

# ------------------------------------------------------------------------------
# 7. 测试相关构建属性
# ------------------------------------------------------------------------------
# 单元测试（./gradlew test）自动联动 Roborazzi 截图校验，防止 UI 视觉回归（对齐 NiA）
roborazzi.test.verify=true

# 插桩测试完成后不自动卸载被测应用，避免各测试类重复安装拖慢执行（对齐 NiA）
android.injected.androidTest.leaveApksInstalledAfterRun=true

# ------------------------------------------------------------------------------
# 8. 业务模块集成开关
# ------------------------------------------------------------------------------
# Flutter 混合工程集成开关（本地开发默认 true；CI 与 pre-push 门禁可通过 -PenableFlutter=false 关闭）
enableFlutter=true
