# 工程级 Gradle 设置。
# IDE（如 Android Studio）用户注意：
# 通过 IDE 配置的 Gradle 设置 *会覆盖*
# 本文件中指定的任何设置。
# 更多构建环境配置细节见
# https://docs.gradle.org/current/userguide/build_environment.html

# ##################################################################################################
# 1. JVM 与 Gradle Daemon 运行环境配置
# ##################################################################################################
# 指定守护进程（daemon）使用的 JVM 参数。
# 该设置对调整内存配置尤其有用。
# 确保重要的默认 jvmargs 不被覆盖，详见 https://github.com/gradle/gradle/issues/19750
#
# org.gradle.jvmargs=-Xmx8g 设置 JVM 的最大堆内存为 8GB。
#-XX:MaxMetaspaceSize=2g 设置元空间的最大大小为 2GB。
#-XX:+UseParallelGC 用于启用并行垃圾收集器。
#-XX:+HeapDumpOnOutOfMemoryError 当内存溢出时，生成堆转储。
#-Dfile.encoding=UTF-8 设置文件编码为 UTF-8。
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ##################################################################################################
# 2. Gradle 构建性能深度优化（参考 Now in Android 实践）
# ##################################################################################################
# 开启多模块并行构建模式，多核 CPU 可并发编译解耦子模块
# 配置后，Gradle 将以孵化阶段的并行模式运行。
# 该选项仅应用于解耦的项目，更多细节见
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true

# 开启 Gradle 本地与远程构建缓存，复用未变更任务的产物输出
org.gradle.caching=true

# 开启文件系统监控，避免每次构建重新全量扫描文件系统（加快增量构建识别）
org.gradle.vfs.watch=true

# 配置缓存（Configuration Cache），跳过构建脚本的配置阶段
# 启用后，配置缓存允许 Gradle 在影响构建配置的内容（如构建脚本）
# 未发生变化时，完全跳过配置阶段。此外，Gradle 还会对任务执行应用性能优化。
#org.gradle.configuration-cache=true
#org.gradle.configuration-cache.parallel=true

# ##################################################################################################
# 3. Kotlin 编译与代码风格配置
# ##################################################################################################
# 本项目的 Kotlin 代码风格："official" 或 "obsolete"：
kotlin.code.style=official
kotlin.jvm.target.validation.mode=warning
# 禁用 KAPT 增量注解处理，防止 DataBinding 编译器抛出 ProcessingEnvironment.getOptions() NPE
kapt.incremental.apt=false

# Compose 编译器性能分析与诊断报告（构建时按需启用，报告输出至 build/compose-metrics 与 build/compose-reports）
#enableComposeCompilerMetrics=true
#enableComposeCompilerReports=true

# ##################################################################################################
# 4. AndroidX 与资源 / R 类特性
# ##################################################################################################
# 启用 AndroidX 支持
android.useAndroidX=true

# 依赖库转换（Jetifier）：
# 注意：由于阿里 ARouter 编译器 (arouter-compiler:1.5.2) 内部仍然使用旧版 support.v4.app.Fragment 字符串判断，
# 需要 Jetifier 将其字节码转换为 androidx.fragment.app.Fragment，否则标记在 Fragment 上的 @Route 注解会编译报错
android.enableJetifier=true

# 启用每个库的R类的命名空间，使其R类仅包含库本身声明的资源
# 而不包含来自库依赖项的资源，从而减少该库的R类大小
# 非传递性R类是推荐的，速度更快/更小
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# ##################################################################################################
# 5. BuildFeatures 默认构建功能开关
# ##################################################################################################
# 禁用默认启用的构建功能，按需在模块中显式开启以加快编译速度
# android.defaults.buildfeatures.aidl=true
# android.defaults.buildfeatures.compose=true
# android.defaults.buildfeatures.buildconfig=true
# android.defaults.buildfeatures.prefab=true
# android.defaults.buildfeatures.renderscript=true
# android.defaults.buildfeatures.resvalues=true
# android.defaults.buildfeatures.shaders=true
android.defaults.buildfeatures.viewbinding=true
# 库构建功能（LibraryBuildFeatures）
# android.defaults.buildfeatures.androidresources=true
# android.defaults.buildfeatures.databinding=true
# android.defaults.buildfeatures.mlmodelbinding=true
# android.defaults.buildfeatures.prefabpublishing=true

# ##################################################################################################
# 6. Gradle 9.0+ / AGP 现代构建属性
# ##################################################################################################
# 当未设置目标SDK时，将默认使用编译SDK版本
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
# 启用应用编译时R类生成，提高构建速度
android.enableAppCompileTimeRClass=true
# 禁止在AndroidManifest.xml中使用uses-sdk标签，鼓励使用build.gradle配置
android.usesSdkInManifest.disallowed=true
# 强制要求每个模块使用唯一的包名
android.uniquePackageNames=true
# 使用依赖约束来管理依赖版本
android.dependency.useConstraints=true
# 开启大型多模块工程依赖约束性能优化（排除库组件约束），大幅提升 Gradle Sync、配置与导入性能
android.dependency.excludeLibraryComponentsFromConstraints=true
# 消除约束启用时的同步提示警告
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
# 启用R8严格完整模式的保留规则，提高代码混淆安全性
android.r8.strictFullModeForKeepRules=true
# 启用R8优化资源收缩，减少APK体积
android.r8.optimizedResourceShrinking=true
# 使用Gradle内置的Kotlin版本，确保兼容性
android.builtInKotlin=false
# 启用新的DSL语法，提供更好的类型安全和性能
android.newDsl=false

# ##################################################################################################
# 7. Flutter 集成与网络代理
# ##################################################################################################
# Flutter 集成开关
enableFlutter=true
# Gradle 构建代理设置
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7890
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7890
# 为 Gradle 9.4+ 启用并行同步
org.gradle.tooling.parallel=true
