# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Ensure important default jvmargs aren't overwritten. See https://github.com/gradle/gradle/issues/19750
#
# org.gradle.jvmargs=-Xmx8g 设置 JVM 的最大堆内存为 8GB。
#-XX:MaxMetaspaceSize=2g 设置元空间的最大大小为 2GB。
#-XX:+UseParallelGC 用于启用并行垃圾收集器。
#-XX:+HeapDumpOnOutOfMemoryError 当内存溢出时，生成堆转储。
#-Dfile.encoding=UTF-8 设置文件编码为 UTF-8。
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
#org.gradle.configuration-cache=true
#org.gradle.configuration-cache.parallel=true
#
# Use AndroidX
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
kotlin.jvm.target.validation.mode=warning
#
# 启用每个库的R类的命名空间，使其R类仅包含库本身声明的资源
# 而不包含来自库依赖项的资源，从而减少该库的R类大小
# 非传递性R类是推荐的，速度更快/更小
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library.
# Non-transitive R classes is recommended and is faster/smaller
android.nonTransitiveRClass=false
android.nonFinalResIds=false
#
# 禁用默认启用的构建功能
# Disable build features that are enabled by default,
# BuildFeatures
# android.defaults.buildfeatures.aidl=true
# android.defaults.buildfeatures.compose=true
# android.defaults.buildfeatures.buildconfig=true
# android.defaults.buildfeatures.prefab=true
# android.defaults.buildfeatures.renderscript=true
# android.defaults.buildfeatures.resvalues=true
# android.defaults.buildfeatures.shaders=true
android.defaults.buildfeatures.viewbinding=true
# LibraryBuildFeatures
# android.defaults.buildfeatures.androidresources=true
# android.defaults.buildfeatures.databinding=true
# android.defaults.buildfeatures.mlmodelbinding=true
# android.defaults.buildfeatures.prefabpublishing=true
# ##################################################################################################
# Gradle 9.0 新增属性
# 当未设置目标SDK时，将默认使用编译SDK版本
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
# 启用应用编译时R类生成，提高构建速度
android.enableAppCompileTimeRClass=true
# 禁止在AndroidManifest.xml中使用uses-sdk标签，鼓励使用build.gradle配置
android.usesSdkInManifest.disallowed=true
# 强制要求每个模块使用唯一的包名
android.uniquePackageNames=true
# 使用依赖约束来管理依赖版本
android.dependency.useConstraints=true
# 启用R8严格完整模式的保留规则，提高代码混淆安全性
android.r8.strictFullModeForKeepRules=true
# 启用R8优化资源收缩，减少APK体积
android.r8.optimizedResourceShrinking=true
# 使用Gradle内置的Kotlin版本，确保兼容性
android.builtInKotlin=false
# 启用新的DSL语法，提供更好的类型安全和性能
android.newDsl=false
# ##################################################################################################
# Flutter 集成开关
enableFlutter=true
# Gradle 构建代理设置
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7890
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7890