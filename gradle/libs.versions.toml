# Lint 自定义规则 API
lint-api = { group = "com.android.tools.lint", name = "lint-api", version.ref = "androidLint" }
# Lint 内置检查实现（自定义规则复用其 Category / Severity 定义）
lint-checks = { group = "com.android.tools.lint", name = "lint-checks", version.ref = "androidLint" }
# Lint 规则单元测试框架（LintDetectorTest）
lint-tests = { group = "com.android.tools.lint", name = "lint-tests", version.ref = "androidLint" }

# ==============================================================================
# 14. Gradle 编译插件与依赖管理工具 (Included Build-logic 依赖)
# ==============================================================================
# Android Gradle Plugin 构件
gradlePlugin-android = { group = "com.android.tools.build", name = "gradle", version.ref = "gradlePluginAndroid" }
# Kotlin Gradle Plugin 构件
gradlePlugin-kotlin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "gradlePluginKotlin" }
# Kotlin Compose 编译器 Gradle 插件构件
gradlePlugin-compose = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "gradlePluginKotlin" }
# Protobuf Gradle 插件构件
gradlePlugin-protobuf = { group = "com.google.protobuf", name = "protobuf-gradle-plugin", version.ref = "gradlePluginProtobuf" }
# ARouter 注册插件构件
gradlePlugin-arouter = { group = "com.alibaba", name = "arouter-register", version.ref = "gradlePluginArouter" }
# GreenDAO Gradle 插件构件
gradlePlugin-greendao = { group = "org.greenrobot", name = "greendao-gradle-plugin", version.ref = "gradlePluginGreenDao" }
# ObjectBox Gradle 插件构件
gradlePlugin-objectbox = { group = "io.objectbox", name = "objectbox-gradle-plugin", version.ref = "gradlePluginObjectBox" }
# KSP Gradle 插件构件
gradlePlugin-ksp = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "gradlePluginKsp" }
# Hilt Gradle 插件构件
gradlePlugin-hilt = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "androidxHilt" }
# Room Gradle 插件构件
gradlePlugin-room = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "androidxRoom" }
# Spotless 格式化 Gradle 插件构件
gradlePlugin-spotless = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version.ref = "spotless" }


[plugins]
# ==============================================================================
# 官方与第三方标准 Gradle 插件
# ==============================================================================
# Android Application 插件
android-application = { id = "com.android.application", version.ref = "gradlePluginAndroid" }
# Android Library 插件
android-library = { id = "com.android.library", version.ref = "gradlePluginAndroid" }
# Kotlin Android 插件
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "gradlePluginKotlin" }
# Kotlin KAPT 注解处理器插件
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "gradlePluginKotlin" }
# Android Lint 静态代码检查插件
android-lint = { id = "com.android.lint", version.ref = "gradlePluginAndroid" }
# Android Test 独立测试插件
android-test = { id = "com.android.test", version.ref = "gradlePluginAndroid" }

# Kotlin Parcelize 序列化代码生成插件
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "gradlePluginKotlin" }
# Kotlin Compose 编译器插件 (Kotlin 2.0+)
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "gradlePluginKotlin" }

# Google KSP (Kotlin Symbol Processing) 注解处理插件
android-ksp = { id = "com.google.devtools.ksp", version.ref = "gradlePluginKsp" }
# Google Hilt 依赖注入插件
android-hilt = { id = "com.google.dagger.hilt.android", version.ref = "androidxHilt" }
# AndroidX Room 架构插件
android-room = { id = "androidx.room", version.ref = "androidxRoom" }

# Flutter Gradle 集成插件 (https://github.com/flutter/flutter/issues/188339)
flutter-gradle-plugin = { id = "dev.flutter.flutter-gradle-plugin", version = "1.0.0" }
# Dropbox 依赖安全与版本漂移守卫插件
dependency-guard = { id = "com.dropbox.dependency-guard", version.ref = "dependencyGuard" }
# Spotless 代码格式化与规范检查插件
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
# AndroidX Baseline Profile 基准配置文件插件
baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidxMacroBenchmark" }
# Roborazzi 截图测试插件（提供 record / verify / compare / compare-report 任务）
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

# ==============================================================================
