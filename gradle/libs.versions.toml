nowinandroid-android-protobuf = { id = "nowinandroid.android.protobuf" }
nowinandroid-android-hilt = { id = "nowinandroid.android.hilt" }
nowinandroid-android-ksp = { id = "nowinandroid.android.ksp" }

# 4. 数据存储插件
