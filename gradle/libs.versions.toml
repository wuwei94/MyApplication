[bundles]
# ==============================================================================
# 依赖套件成组 (Dependency Bundles - 参考 Now in Android 实践)
# 便于子模块一行引入高频强关联依赖组，减少样板代码并统一版本
# ==============================================================================
# Jetpack Compose 核心基础组件套件（UI 基础、图形渲染、预览工具、Material 3）
androidx-compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-material3"
]

# AndroidX Lifecycle 架构组件套件（运行时生命周期感知 + ViewModel 数据流模型）
androidx-lifecycle = [
    "androidx-lifecycle-runtime",
    "androidx-lifecycle-viewmodel"
]

# SmartRefresh 下拉刷新套件（核心库 + 默认 ClassicsHeader + 默认 ClassicsFooter）
smartrefresh = [
    "smartrefresh-layout",
    "smartrefresh-header",
    "smartrefresh-footer"
]

# 单元测试基础套件（JUnit 4 + 协程测试调度器 + Turbine Flow 断言）
# 说明：Turbine 依赖 kotlinx-coroutines-test 的非稳定 API，两者版本必须随 kotlinxCoroutines 同步升级
testing-unit = [
    "junit",
    "kotlinx-coroutines-test",
    "turbine"
]

# 仪器化 UI 测试基础套件（JUnit KTX 运行时 + Espresso 核心事件断言库）
testing-android = [
    "androidx-test-ext",
    "androidx-test-espresso"
]

# Compose 截图测试套件（Robolectric 运行时 + Roborazzi 核心 + Compose UI 测试规则）
# 说明：仅截图测试模块按需引入，不进入全局公共依赖，避免拖慢其它模块编译；
# ui-test-manifest 是 androidTest 专用，不放入本套件
testing-screenshot = [
    "robolectric",
    "roborazzi",
    "roborazzi-compose",
    "roborazzi-junit-rule",
    "androidx-compose-ui-test-junit4"
]

# Lint 自定义规则开发套件（lint-api 编译期 + lint-tests 测试期）
lint-rules = [
    "lint-api",
    "lint-checks"
]
