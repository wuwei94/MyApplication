[versions]
# ==============================================================================
# 0. 应用语义化版本定义 (SemVer: Major.Minor.Patch)
# ==============================================================================
# versionCode 与 versionName 由 Gradle 自动计算合成 (versionCode = Major * 10000 + Minor * 100 + Patch)
version-major = "1"
version-minor = "0"
version-patch = "0"

# ==============================================================================
# 1. 核心运行时与 Kotlin 基础设施
# ==============================================================================
# Java 8+ API 脱糖支持库（让低版本 Android 支持现代 Java API）
# 文档: https://developer.android.google.cn/studio/write/java8-support-table
androidDesugarJdkLibs = "2.1.5"
# Kotlin 官方协程库（异步编程与流式处理）
# GitHub: https://github.com/Kotlin/kotlinx.coroutines
kotlinxCoroutines = "1.10.2"

# ==============================================================================
# 2. Google 核心基础库与 Material Design
# ==============================================================================
# Google 高性能 JSON 序列化/反序列化库
# GitHub: https://github.com/google/gson
googleGson = "2.13.1"
# Google 核心 Java/Android 工具集（集合、并发、缓存等）
# GitHub: https://github.com/google/guava
googleGuava = "33.5.0-android"
# Google 跨语言结构化数据协议 Protocol Buffers
# 官网: https://protobuf.dev/
# GitHub: https://github.com/protocolbuffers/protobuf
googleProtobuf = "4.33.4"
# Google 弹性盒流式布局
# GitHub: https://github.com/google/flexbox-layout
googleFlexbox = "3.0.0"
# Material Components 现代化 Android UI 设计组件库
# 官网: https://m3.material.io/
# GitHub: https://github.com/material-components/material-components-android
googleMaterial = "1.13.0"

# ==============================================================================
# 3. AndroidX 核心组件与基础 UI 控件
# ==============================================================================
# AndroidX 核心 KTX 扩展
# 文档: https://developer.android.google.cn/jetpack/androidx/releases/core
androidxCore = "1.17.0"
# AndroidX Activity KTX
# 文档: https://developer.android.google.cn/jetpack/androidx/releases/activity
androidxActivity = "1.12.3"
# AndroidX Fragment KTX
# 文档: https://developer.android.google.cn/jetpack/androidx/releases/fragment
androidxFragment = "1.8.9"
# Android 12+ 启动动画与 Splash 兼容库
# 文档: https://developer.android.google.cn/develop/ui/views/launch/splash-screen
androidxSplashscreen = "1.2.0"
# AndroidX 兼容基础包
# 文档: https://developer.android.google.cn/jetpack/androidx/releases/appcompat
androidxAppCompat = "1.7.1"
# 约束布局 ConstraintLayout
# 文档: https://developer.android.google.cn/jetpack/androidx/releases/constraintlayout
androidxConstraintLayout = "2.2.1"
# 高效列表组件 RecyclerView
# 文档: https://developer.android.google.cn/jetpack/androidx/releases/recyclerview
androidxRecyclerView = "1.4.0"
# 页面滑动组件 ViewPager2
# 文档: https://developer.android.google.cn/jetpack/androidx/releases/viewpager2
androidxViewPager2 = "1.1.0"
# 异步布局加载器（UI 性能优化）
# 文档: https://developer.android.google.cn/jetpack/androidx/releases/asynclayoutinflater
androidxAsyncLayoutInflater = "1.0.0"

# ==============================================================================
# 4. AndroidX 架构组件与依赖注入 (Jetpack Architecture)
# ==============================================================================
# 生命周期组件 Lifecycle (ViewModel, LiveData, ProcessLifecycle)
# 文档: https://developer.android.google.cn/topic/libraries/architecture/lifecycle
androidxLifecycle = "2.10.0"
# 分页加载组件 Paging 3
# 文档: https://developer.android.google.cn/topic/libraries/architecture/paging/v3-overview
androidxPaging = "3.3.6"
# 现代化轻量键值与对象存储 DataStore
# 文档: https://developer.android.google.cn/topic/libraries/architecture/datastore
androidxDataStore = "1.2.0"
# 确定性后台任务调度框架 WorkManager
# 文档: https://developer.android.google.cn/topic/libraries/architecture/workmanager
androidxWorkManager = "2.11.1"
# 应用内导航架构 Navigation
# 文档: https://developer.android.google.cn/guide/navigation
androidxNavigation = "2.9.7"
# 应用启动初始化框架 App Startup
# 文档: https://developer.android.google.cn/topic/libraries/app-startup
androidxStartup = "1.2.0"
# 基线配置文件安装器 ProfileInstaller（优化冷启动速度）
# 文档: https://developer.android.google.cn/topic/performance/baselineprofiles/overview
androidxProfileInstaller = "1.4.1"
# Jetpack JankStats 运行时卡顿（Jank）帧采集库
# 文档: https://developer.android.google.cn/topic/performance/jankstats
androidxMetrics = "1.0.0"
# AndroidX 系统追踪库（写入自定义 trace section，可在 System Trace / Perfetto 中观测）
# 文档: https://developer.android.google.cn/topic/performance/tracing
# 说明: 1.3.0 起 tracing 为聚合 POM，真实实现位于 tracing-android，无需单独声明
androidxTracing = "1.3.0"
# Google 官方依赖注入框架 Hilt
# 文档: https://developer.android.google.cn/training/dependency-injection/hilt-android
androidxHilt = "2.58"
# Kotlin 实用轻量级依赖注入框架 Koin
# 官网: https://insert-koin.io/
# GitHub: https://github.com/InsertKoinIO/koin
koin = "4.0.2"
# 官方 SQLite ORM 数据库框架 Room
# 文档: https://developer.android.google.cn/training/data-storage/room
androidxRoom = "2.8.4"

# ==============================================================================
# 5. Jetpack Compose 现代化声明式 UI
# ==============================================================================
# Compose 与 Kotlin 编译器的兼容性映射关系
# 文档: https://developer.android.google.cn/jetpack/androidx/releases/compose-kotlin
androidxComposeCompiler = "1.5.15"
# Compose 物料清单 BOM（统一管理 Compose 各模块版本）
# 文档: https://developer.android.google.cn/jetpack/compose/bom
androidxComposeBom = "2026.01.01"
# Compose LiveData 响应式绑定扩展
androidxLiveDataCompose = "1.10.2"
# Compose ConstraintLayout 约束布局
androidxConstraintLayoutCompose = "1.1.1"
# Compose 版 SmartRefreshLayout 下拉刷新
# GitHub: https://github.com/loren-moon/ComposeSmartRefresh
smartRefreshcCompose = "2.1.0"

# ==============================================================================
# 6. 系统硬件、多媒体与边缘智能 (Camera, Bluetooth, LiteRT)
# ==============================================================================
# 官方现代化相机开发套件 CameraX
# 文档: https://developer.android.google.cn/jetpack/androidx/releases/camera
androidxCamera = "1.3.0"
# Nordic 官方低功耗蓝牙（BLE）通信开发库
# GitHub: https://github.com/NordicSemiconductor/Android-BLE-Library
nordicBle = "2.9.0"
# 经典 Android BLE 快速开发框架 FastBle
# GitHub: https://github.com/Jasonchenlijian/FastBle
fastBle = "2.4.0"
# 基于 RxJava 的反应式低功耗蓝牙库 RxAndroidBle
# GitHub: https://github.com/dariuszseweryn/RxAndroidBle
rxAndroidBle = "1.18.1"
# 基于 OpenGL 的实时图像/滤镜处理库 GPUImage
# GitHub: https://github.com/cats-oss/android-gpuimage
gpuimage = "2.1.0"
# Google 官方端侧 AI 推理引擎 LiteRT (原 TensorFlow Lite)
# 文档: https://ai.google.dev/edge/litert
tensorflowLite = "1.4.0"

# ==============================================================================
# 7. 网络通信、传输协议与服务端 (HTTP, WebSocket, MQTT, Netty)
# ==============================================================================
# Square 工业级 HTTP/HTTP2 客户端 OkHttp
# 官网: https://square.github.io/okhttp/
# GitHub: https://github.com/square/okhttp
okhttp = "5.1.0"
# Square 类型安全的 HTTP REST API 请求库 Retrofit
# 官网: https://square.github.io/retrofit/
# GitHub: https://github.com/square/retrofit
retrofit = "3.0.0"
# JetBrains 官方跨平台异步网络框架 Ktor
# 官网: https://ktor.io/
ktor = "3.2.3"
# Google 传统轻量网络请求库 Volley
# 文档: https://developer.android.google.cn/training/volley
volley = "1.2.1"
# 高性能异步事件驱动网络通信框架 Netty
# 官网: https://netty.io/
netty = "4.1.122.Final"
# 嵌入式轻量级 HTTP/Web 服务器 NanoHTTPD
# GitHub: https://github.com/NanoHttpd/nanohttpd
nanohttpd = "2.3.1"
# Java WebSocket 全双工通信客户端与服务端
# GitHub: https://github.com/TooTallNate/Java-WebSocket
websocket = "1.6.0"
# Eclipse 官方 Paho MQTT Java 核心客户端
# GitHub: https://github.com/eclipse-paho/paho.mqtt.java
mqtt = "1.2.5"
# hannesa2 维护的 Paho Android Service 现代化 Fork
# 背景说明：原官方 org.eclipse.paho 1.1.1 已停更，其 AlarmPingSender 在 targetSdk 34+ 上
# 注册 Receiver 缺少导出标志会导致运行时抛出 SecurityException，本 fork 解决了该安全崩溃
# GitHub: https://github.com/hannesa2/paho.mqtt.android
pahoAndroidService = "4.5"
# HiveMQ 高吞吐、响应式 MQTT 客户端
# GitHub: https://github.com/hivemq/hivemq-mqtt-client
hivemq = "1.3.7"
# Java 统一日志门面 SLF4J
# 官网: https://www.slf4j.org/
slf4j = "2.0.17"

# ==============================================================================
# 8. 图片加载与处理体系
# ==============================================================================
# Google 推荐的成熟图片加载与缓存库 Glide
# GitHub: https://github.com/bumptech/glide
glide = "4.16.0"
# 基于 Kotlin 协程的新一代轻量异步图片加载库 Coil
# 官网: https://coil-kt.github.io/coil/
# GitHub: https://github.com/coil-kt/coil
coil = "3.1.0"

# ==============================================================================
# 9. 本地持久化与高性能数据存储
# ==============================================================================
# 腾讯基于 mmap 的高性能通用 Key-Value 键值存储组件 MMKV
# GitHub: https://github.com/Tencent/MMKV
mmkv = "2.3.0"
# 超高性能 NoSQL 嵌入式对象数据库 ObjectBox
# 官网: https://objectbox.io/
# GitHub: https://github.com/objectbox/objectbox-java
objectbox = "5.1.0"
# 经典 SQLite ORM 框架 GreenDAO (本项目目前已全面转向 Room)
# GitHub: https://github.com/greenrobot/greenDAO
greendao = "3.3.0"

# ==============================================================================
# 10. 响应式编程与组件间通信 (Reactive & Routing)
# ==============================================================================
# 阿里巴巴组件化路由框架 ARouter
# GitHub: https://github.com/alibaba/ARouter
arouter = "1.5.2"
# 经典发布-订阅事件总线 EventBus
# GitHub: https://github.com/greenrobot/EventBus
eventbus = "3.3.1"
# RxJava 3 Android 线程调度扩展
# GitHub: https://github.com/ReactiveX/RxAndroid
rxandroid = "3.0.2"
# RxJava 结合 Android 生命周期的自动解绑工具
# GitHub: https://github.com/trello/RxLifecycle
rxlifecycle = "4.0.2"
# Uber 出品基于 Android 生命周期的响应式流自动注销框架
# GitHub: https://github.com/uber/AutoDispose
autodispose = "2.2.1"

# ==============================================================================
# 11. 动效、动画与矢量渲染引擎
# ==============================================================================
# 腾讯开源通用跨平台动效渲染组件 PAG
# 官网: https://pag.art/
# GitHub: https://github.com/Tencent/libpag
pag = "4.5.12"
# Airbnb 出品 Adobe After Effects 矢量动画渲染库 Lottie
# 官网: https://airbnb.io/lottie/
# GitHub: https://github.com/airbnb/lottie-android
lottie = "6.6.7"
# 移动端高性能矢量动画播放器 SVGAPlayer
# GitHub: https://github.com/svga/SVGAPlayer-Android
svgaPlayer = "2.6.1"

# ==============================================================================
# 12. 常用实用工具与第三方 UI 增强库
# ==============================================================================
# BRVAH: 强大灵活的 RecyclerView 适配器辅助库 (v4)
# GitHub: https://github.com/CymChad/BaseRecyclerViewAdapterHelper
brvah = "4.3.2"
# 经典下拉刷新与上拉加载框架 SmartRefreshLayout (v2)
# GitHub: https://github.com/scwang90/SmartRefreshLayout
smartrefresh = "2.1.1"
# 页面多状态管理框架（加载中/空数据/错误态切换）LoadSir
# GitHub: https://github.com/KingJA/LoadSir
loadsir = "1.3.8"
# Airbnb 现代化 MVI 状态驱动架构框架 Mavericks
# 官网: https://airbnb.io/mavericks/
# GitHub: https://github.com/airbnb/mavericks
mavericks = "3.0.10"
# Blankj 经典 Android 常用工具类集合 UtilCode
# GitHub: https://github.com/Blankj/AndroidUtilCode
utils = "1.31.1"
# 郭霖出品链式调用权限请求框架 PermissionX
# GitHub: https://github.com/guolindev/PermissionX
permission = "1.8.1"
# 腾讯 Bugly 应用内更新与热更新组件
# GitHub: https://github.com/BuglyDevTeam/BuglyBetaUploader
upgrade = "2.2.0"
# 经典轮播图控件 Banner
# GitHub: https://github.com/youth5201314/banner
banner = "2.2.3"
# 实时模糊视图 BlurView
# GitHub: https://github.com/mmin18/RealtimeBlurView
blurview = "1.2.1"
# 仿美团/京东城市选择器 CityPicker
# GitHub: https://github.com/zaaach/CityPicker
citypicker = "2.0.3"
# 灵活高效倒计时控件 CountdownView
# GitHub: https://github.com/iwgang/CountdownView
countdownview = "2.1.6"
# 全局悬浮窗框架 EasyFloat
# GitHub: https://github.com/princekin-f/EasyFloat
easyfloat = "2.0.4"
# 扩展 TabLayout 导航库 FlycoTabLayout
# GitHub: https://github.com/H07000223/FlycoTabLayout
tablayout = "3.0.0"
# 支持手势缩放平移的 ImageView 扩展库 PhotoView
# GitHub: https://github.com/chrisbanes/PhotoView
photoview = "2.3.0"
# 时间与条件滚动选择器 PickerView
# GitHub: https://github.com/Bigkoo/Android-PickerView
pickerview = "4.1.9"
# 强大易用的相册多媒体图片选择器 PictureSelector
# GitHub: https://github.com/LuckSiege/PictureSelector
pictureselector = "v3.11.2"
# 万能阴影布局 ShadowLayout
# GitHub: https://github.com/lihangleo2/ShadowLayout
shadowlayout = "3.3.2"
# 滑动侧滑菜单布局 SwipeLayout
# GitHub: https://github.com/daimajia/AndroidSwipeLayout
swipelayout = "1.2.0"
# 经典图表统计库 MPAndroidChart
# GitHub: https://github.com/PhilJay/MPAndroidChart
mpandroidchart = "v3.1.0"
# Markdown 原生渲染引擎 Markwon
# GitHub: https://github.com/noties/Markwon
markwon = "4.6.2"
# 代码语法高亮排版引擎 Prism4j
# GitHub: https://github.com/noties/Prism4j
prism4j = "2.0.0"

# ==============================================================================
# 13. 单元测试与仪器化测试 (Testing)
# ==============================================================================
# Java 单元测试标准框架 JUnit 4
# 官网: https://junit.org/junit4/
junit = "4.13.2"
# AndroidX 单元测试扩展 JUnit KTX
# 文档: https://developer.android.google.cn/training/testing
androidxTestExt = "1.3.0"
# 官方 UI 自动化测试框架 Espresso
# 文档: https://developer.android.google.cn/training/testing/espresso
androidxTestEspresso = "3.7.0"
# AndroidX Macrobenchmark (冷启动、流畅度与基准配置文件生成)
# 文档: https://developer.android.google.cn/topic/performance/benchmarking/macrobenchmark-overview
androidxMacroBenchmark = "1.3.3"
# UI Automator 与测试运行套件
androidxUiAutomator = "2.3.0"
androidxTestRules = "1.6.1"
androidxTestRunner = "1.6.2"
# Turbine：kotlinx.coroutines Flow 流式断言库（awaitItem / awaitComplete / awaitError）
# GitHub: https://github.com/cashapp/turbine
turbine = "1.2.1"
# Robolectric：JVM 上的 Android 运行时，Roborazzi 截图测试的底座
# 官网: https://robolectric.org/
robolectric = "4.16.1"
# Roborazzi：基于 Robolectric 的 JVM 截图回归测试（record / verify / compare）
# GitHub: https://github.com/takahirom/roborazzi
roborazzi = "1.73.0"
# AndroidX Lint 自定义规则 API（版本必须与 AGP 9.1.0 内置 Lint 对齐，否则规则无法加载）
# 文档: https://googlesamples.github.io/android-custom-lint-rules/
androidLint = "32.1.0"

# Spotless 代码格式化 Gradle 插件与 ktlint
# GitHub: https://github.com/diffplug/spotless
spotless = "7.0.2"
ktlint = "1.4.0"

# ==============================================================================
# 14. Gradle 编译插件与依赖管理工具
# ==============================================================================
# Android Gradle Plugin (AGP) 构建工具
# 发行注记: https://developer.android.google.cn/studio/releases/gradle-plugin
gradlePluginAndroid = "9.1.0"
# Kotlin Gradle 编译插件
# 发行注记: https://kotlinlang.org/docs/releases.html
gradlePluginKotlin = "2.2.20"
# Google Protocol Buffers Gradle 插件
gradlePluginProtobuf = "0.9.6"
# 阿里 ARouter 路由自动注册插件
gradlePluginArouter = "1.0.2"
# GreenDAO Gradle 插件
gradlePluginGreenDao = "3.3.1"
# ObjectBox 字节码编织 Gradle 插件
gradlePluginObjectBox = "5.1.0"
# Kotlin Symbol Processing (KSP) 插件
# GitHub: https://github.com/google/ksp
gradlePluginKsp = "2.2.20-2.0.4"
# Dropbox 出品依赖守卫插件（监控和检测发版依赖树异常变动）
# GitHub: https://github.com/dropbox/dependency-guard
dependencyGuard = "0.5.0"


[libraries]
# ==============================================================================
# 1. 核心运行时与 Kotlin 基础设施
# ==============================================================================
# Java 8+ API 脱糖运行时支持
android-desugarJdkLibs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "androidDesugarJdkLibs" }
# Kotlin 协程核心库
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
# Kotlin 协程 Android 调度器与主线程调度
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
# Kotlin 协程与 RxJava 3 互操作扩展
kotlinx-coroutines-rx3 = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-rx3", version.ref = "kotlinxCoroutines" }

# ==============================================================================
# 2. Google 核心基础库与 Material Design
# ==============================================================================
# Google Gson JSON 序列化库
google-gson = { group = "com.google.code.gson", name = "gson", version.ref = "googleGson" }
# Google Guava 核心工具包
google-guava = { group = "com.google.guava", name = "guava", version.ref = "googleGuava" }
# Protobuf 编译器
google-protoc = { group = "com.google.protobuf", name = "protoc", version.ref = "googleProtobuf" }
# Protobuf JavaLite 移动端精简运行时
google-protobuf-javalite = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "googleProtobuf" }
# Google 弹性盒流式布局
google-flexBox = { group = "com.google.android.flexbox", name = "flexbox", version.ref = "googleFlexbox" }
# Material Design 控件库
google-material = { group = "com.google.android.material", name = "material", version.ref = "googleMaterial" }

# ==============================================================================
# 3. AndroidX 核心组件与基础 UI 控件
# ==============================================================================
# AndroidX 核心 KTX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
# Activity KTX 扩展
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivity" }
# Fragment KTX 扩展
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidxFragment" }
# Android 12+ 启动画面的官方向下兼容库
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxSplashscreen" }
# AppCompat 兼容框架
androidx-appCompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppCompat" }
# ConstraintLayout 约束布局
androidx-constraintLayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidxConstraintLayout" }
# RecyclerView 列表控件
androidx-recyclerView = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidxRecyclerView" }
# ViewPager2 滑动分页控件
androidx-viewPager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "androidxViewPager2" }
# 异步布局加载器 AsyncLayoutInflater
androidx-asyncLayoutInflater = { group = "androidx.asynclayoutinflater", name = "asynclayoutinflater", version.ref = "androidxAsyncLayoutInflater" }

# ==============================================================================
# 4. AndroidX 架构组件与依赖注入 (Jetpack Architecture)
# ==============================================================================
# Lifecycle 运行时 KTX
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
# Lifecycle ViewModel KTX
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
# Lifecycle 与 Compose 联动扩展
